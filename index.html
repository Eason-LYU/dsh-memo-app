<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="阿蓝" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon.svg" />
<title>阿蓝 · 手机端</title>
<style>
  :root{
    --bg:#0b1220; --panel:#121b2c; --panel-2:#18233a; --line:#243049;
    --text:#e8eefc; --dim:#93a2bf; --accent:#4c8dff; --accent-2:#7bd3ff;
    --ok:#2fd08a; --warn:#ffb020; --err:#ff5d6c;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;
    display:flex;flex-direction:column;overscroll-behavior:none;
  }
  header{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
    background:linear-gradient(180deg,#0b1220f2,#0b1220d9);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:0 0 auto}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
  .title{font-weight:600;letter-spacing:.3px}
  .sub{font-size:11.5px;color:var(--dim);margin-top:1px}
  .spacer{flex:1}
  .iconbtn{
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    border-radius:11px;padding:7px 11px;font-size:13px;line-height:1;
  }
  .iconbtn:active{transform:scale(.97)}
  main{flex:1;overflow-y:auto;padding:14px 12px 8px;-webkit-overflow-scrolling:touch}
  .msg{max-width:88%;margin:0 0 10px;padding:10px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
  .user{margin-left:auto;background:#1d3a6b;border:1px solid #2a4d86;border-bottom-right-radius:5px}
  .ai{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
  .ai .meta{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:11px;color:var(--dim)}
  .chip{border:1px solid var(--line);border-radius:7px;padding:2px 7px;background:#0f1727;color:var(--dim);font-size:11px}
  .hint{color:var(--dim);font-size:13px;text-align:center;margin:24px 12px;line-height:1.7}
  footer{
    position:sticky;bottom:0;z-index:20;padding:8px 10px calc(8px + var(--safe-b));
    background:linear-gradient(0deg,#0b1220f7,#0b1220cc);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end;
  }
  textarea{
    flex:1;resize:none;max-height:132px;min-height:42px;padding:10px 12px;border-radius:12px;
    border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;outline:none;
  }
  textarea:focus{border-color:#33518a}
  .send{
    width:44px;height:44px;border-radius:12px;border:none;background:var(--accent);color:#04101f;
    font-weight:700;font-size:18px;flex:0 0 auto;
  }
  .send:disabled{opacity:.45}
  .sheet{
    position:fixed;inset:0;z-index:50;display:none;background:#050a14cc;backdrop-filter:blur(3px);
  }
  .sheet.open{display:flex;align-items:flex-end}
  .sheetbox{
    width:100%;max-height:88vh;overflow-y:auto;background:var(--panel);
    border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:14px 14px calc(20px + var(--safe-b));
  }
  .sheetbox h3{margin:2px 0 12px;font-size:15px}
  .row{display:flex;gap:8px;align-items:center;margin:0 0 10px}
  .row label{width:92px;color:var(--dim);font-size:13px;flex:0 0 auto}
  input,select{
    flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font:inherit;font-size:14px;outline:none;
  }
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
  .tab{padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:#0f1727;color:var(--dim);font-size:12.5px;white-space:nowrap}
  .tab.on{background:#1d3a6b;color:#dfe9ff;border-color:#2a4d86}
  pre{white-space:pre-wrap;word-break:break-word;background:#0d1526;border:1px solid var(--line);
      border-radius:11px;padding:10px;font-size:12.5px;line-height:1.6;max-height:44vh;overflow:auto;color:#cfe0ff}
  .btn{
    width:100%;padding:11px;border-radius:11px;border:1px solid #2a4d86;background:#1d3a6b;
    color:#e9f1ff;font:inherit;font-weight:600;margin-top:8px;
  }
  .btn.ghost{background:transparent;color:var(--dim);border-color:var(--line);font-weight:500}
  .note{color:var(--dim);font-size:12px;line-height:1.6;margin:8px 0 0}
  .toast{
    position:fixed;left:50%;bottom:calc(76px + var(--safe-b));transform:translateX(-50%);
    background:#1b2942;border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:11px;
    font-size:13px;z-index:80;opacity:0;transition:.2s;pointer-events:none;max-width:88vw;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <span class="dot" id="statusDot"></span>
  <div>
    <div class="title">阿蓝 · 手机端</div>
    <div class="sub" id="statusText">未同步</div>
  </div>
  <div class="spacer"></div>
  <button class="iconbtn" id="btnMemo">记忆</button>
  <button class="iconbtn" id="btnSync">同步</button>
  <button class="iconbtn" id="btnSet">设置</button>
</header>

<main id="feed">
  <div class="hint" id="hint">
    还没有配置。<br />点右上角「设置」填 API Key 与 GitHub 信息，<br />然后点「同步」把电脑上的记忆包拉下来。
  </div>
</main>

<footer>
  <textarea id="input" rows="1" placeholder="说点什么…（Shift+Enter 换行）"></textarea>
  <button class="send" id="send">↑</button>
</footer>

<!-- 设置 -->
<div class="sheet" id="sheetSet">
  <div class="sheetbox">
    <h3>设置</h3>
    <div class="row"><label>API Key</label><input id="cfgKey" type="password" placeholder="sk-…" autocomplete="off" /></div>
    <div class="row"><label>模型</label>
      <select id="cfgModel">
        <option value="deepseek-chat">deepseek-chat</option>
        <option value="deepseek-reasoner">deepseek-reasoner</option>
      </select>
    </div>
    <div class="row"><label>API 地址</label><input id="cfgBase" placeholder="https://api.deepseek.com" /></div>
    <div class="row"><label>数据仓</label><input id="cfgRepo" placeholder="Eason-LYU/dsh-memo-data" /></div>
    <div class="row"><label>分支</label><input id="cfgBranch" placeholder="main" /></div>
    <div class="row"><label>PAT</label><input id="cfgPat" type="password" placeholder="github_pat_…" autocomplete="off" /></div>
    <div class="row"><label>包目录</label><input id="cfgPrefix" placeholder="pack" /></div>
    <p class="note">Key 与 PAT 只存在这台手机的浏览器里（localStorage），不会上传到别处。PAT 只给数据仓 Contents 读写权限即可。</p>
    <button class="btn" id="saveCfg">保存并同步</button>
    <button class="btn ghost" id="diagBtn">诊断</button>
    <pre id="diagOut" style="display:none;margin-top:10px"></pre>
    <button class="btn ghost" id="closeSet">关闭</button>
  </div>
</div>

<!-- 记忆 -->
<div class="sheet" id="sheetMemo">
  <div class="sheetbox">
    <h3>记忆包</h3>
    <div class="tabs" id="memoTabs"></div>
    <pre id="memoBody">（还没拉取）</pre>
    <button class="btn" id="btnMemoPull">重新拉取</button>
    <button class="btn ghost" id="closeMemo">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const LS = 'dsh-memo-v1';
const cfg = Object.assign({
  key:'', model:'deepseek-chat', base:'https://api.deepseek.com',
  repo:'', branch:'main', pat:'', prefix:'pack'
}, JSON.parse(localStorage.getItem(LS) || '{}'));

const $ = (id) => document.getElementById(id);
const feed = $('feed');
let pack = { files:{}, at:null };
let history = [];
let busy = false;

function saveCfg(){ localStorage.setItem(LS, JSON.stringify(cfg)); }
function toast(msg, ms=2200){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), ms);
}
function setStatus(kind, text){
  $('statusDot').className = 'dot ' + (kind||'');
  $('statusText').textContent = text;
}

/* ---------- base64 / utf8 ---------- */
function b64decode(b64){
  const bin = atob(b64.replace(/\s/g,''));
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}

/* ---------- GitHub ---------- */
const lastGh = { errors: [] };
function ghUrl(p, method){
  return `https://api.github.com/repos/${cfg.repo}/contents/${p.split('/').map(encodeURIComponent).join('/')}`
    + (method === 'GET' ? `?ref=${encodeURIComponent(cfg.branch)}` : '');
}
async function gh(method, p, body){
  if (!cfg.repo || !cfg.pat) throw new Error('还没填数据仓/PAT');
  const res = await fetch(ghUrl(p, method), {
    method,
    headers: {
      'Authorization': 'Bearer ' + cfg.pat,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(body ? {'Content-Type':'application/json'} : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 404) return null;
  if (!res.ok){
    const t = await res.text();
    lastGh.errors.push(`${method} ${p} → ${res.status}`);
    throw new Error(`GitHub ${res.status} ${p}：${t.slice(0,120)}`);
  }
  return res.json();
}

// 只填了仓库名（没有 owner）时，用当前 token 的登录名补上前缀
async function normalizeRepo(){
  if (!cfg.repo || cfg.repo.includes('/')) return cfg.repo;
  const me = await fetch('https://api.github.com/user', {
    headers: { 'Authorization': 'Bearer ' + cfg.pat, 'User-Agent': 'dsh-memo' }
  }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  if (me?.login){ cfg.repo = me.login + '/' + cfg.repo; saveCfg(); }
  return cfg.repo;
}

async function pullPack(){
  await normalizeRepo();
  const names = ['persona.md','rules.md','style.md','recent.md','skills.md','meta.json'];
  const files = {};
  const status = [];
  for (const n of names){
    let r = null;
    try { r = await gh('GET', `${cfg.prefix}/${n}`) }
    catch(e){ status.push(`${n}: ${e.message.slice(0,60)}`); continue }
    if (r && r.content) files[n] = b64decode(r.content);
    else status.push(`${n}: 404`);
  }
  if (!Object.keys(files).length){
    const hint = [
      `仓库 ${cfg.repo} · 分支 ${cfg.branch} · 目录 ${cfg.prefix}`,
      `PAT 长度 ${cfg.pat.length}`,
      ...status.slice(0,3),
    ].join(' / ');
    throw new Error('没读到记忆包：' + hint);
  }
  pack = { files, at: new Date() };
  const meta = files['meta.json'] ? JSON.parse(files['meta.json']) : null;
  const when = meta?.generatedAt ? new Date(meta.generatedAt).toLocaleString() : '未知时间';
  const kb = (Object.values(files).join('').length/1024).toFixed(1);
  setStatus('ok', `记忆包 ${kb} KB · ${when}`);
  renderMemo();
  return pack;
}

async function appendPhoneNote(text){
  const d = new Date();
  const day = d.toISOString().slice(0,10);
  const stamp = d.toTimeString().slice(0,5);
  const path = `${cfg.prefix}/phone/${day}.md`;
  let cur = '';
  let sha = null;
  const existing = await gh('GET', path).catch(()=>null);
  if (existing){ sha = existing.sha; cur = b64decode(existing.content); }
  const line = `\n- ${stamp} ${text.replace(/\s+/g,' ').trim().slice(0,400)}`;
  const body = { message: `phone: ${day} ${stamp}`, content: b64encode(cur + line), branch: cfg.branch };
  if (sha) body.sha = sha;
  await gh('PUT', path, body);
}

/* ---------- 记忆面板 ---------- */
const MEMO_TABS = [
  ['recent.md','近况'], ['persona.md','人格'], ['rules.md','规则'],
  ['style.md','风格'], ['skills.md','技能'],
];
let memoCur = 'recent.md';
function renderMemo(){
  const tabs = $('memoTabs');
  tabs.innerHTML = '';
  for (const [f,label] of MEMO_TABS){
    const b = document.createElement('button');
    b.className = 'tab' + (f===memoCur?' on':'');
    b.textContent = label;
    b.onclick = ()=>{ memoCur = f; renderMemo(); };
    tabs.appendChild(b);
  }
  $('memoBody').textContent = pack.files[memoCur] || '（还没拉取）';
}

/* ---------- 聊天 ---------- */
function addMsg(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + (role==='user'?'user':'ai');
  const body = document.createElement('div');
  body.textContent = text;
  div.appendChild(body);
  if (role === 'assistant'){
    const meta = document.createElement('div');
    meta.className = 'meta';
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = '记进手机笔记';
    chip.onclick = async () => {
      try { await appendPhoneNote(text); toast('已写进今天的手机笔记'); }
      catch(e){ toast('写入失败：' + e.message, 3200); }
    };
    meta.appendChild(chip);
    div.appendChild(meta);
  }
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
  return div;
}

function systemPrompt(){
  const f = pack.files;
  const parts = [];
  parts.push('你叫「阿蓝」，一条蓝色小鱼，是用户的 AI 助手。说话轻快、短句优先，正事优先，俏皮话放最后。');
  if (f['persona.md']) parts.push('# 人格设定\n' + f['persona.md']);
  if (f['rules.md']) parts.push('# 用户的硬性规则（必须遵守）\n' + f['rules.md']);
  if (f['style.md']) parts.push('# 风格与交付偏好\n' + f['style.md']);
  if (f['recent.md']) parts.push('# 用户最近在做的事（来自电脑，可能滞后）\n' + f['recent.md']);
  if (f['skills.md']) parts.push('# 已固化的技能\n' + f['skills.md']);
  parts.push([
    '## 这台设备的限制',
    '你现在跑在手机上，看不到电脑的文件和终端，不能执行任务、不能跑代码。',
    '如果用户要的是「在电脑上动手」，说明需要回到电脑前继续，并给出可以照做的步骤。',
    '回答保持中文，长度适合手机阅读；需要清单时用短句。',
  ].join('\n'));
  return parts.join('\n\n');
}

async function send(){
  const input = $('input');
  const text = input.value.trim();
  if (!text || busy) return;
  if (!cfg.key){ toast('先在设置里填 API Key'); return; }
  input.value = ''; input.style.height = 'auto';
  addMsg('user', text);
  history.push({role:'user', content:text});

  busy = true; $('send').disabled = true;
  const bubble = addMsg('assistant', '');
  const body = bubble.firstChild;

  try{
    const res = await fetch(cfg.base.replace(/\/$/,'') + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + cfg.key },
      body: JSON.stringify({
        model: cfg.model,
        stream: true,
        messages: [{role:'system', content: systemPrompt()}, ...history.slice(-20)],
      })
    });
    if (!res.ok){
      const t = await res.text();
      throw new Error('API ' + res.status + '：' + t.slice(0, 200));
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', out = '';
    while (true){
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts){
        for (const line of part.split('\n')){
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') continue;
          try{
            const j = JSON.parse(data);
            const d = j.choices?.[0]?.delta?.content || '';
            if (d){ out += d; body.textContent = out; feed.scrollTop = feed.scrollHeight; }
          }catch{}
        }
      }
    }
    history.push({role:'assistant', content: out || '（空回复）'});
  }catch(e){
    body.textContent = '出错了：' + e.message + (e.message.includes('Failed to fetch') ? '\n（浏览器直连 API 被跨域拦截时，需要加一个代理地址，我可以给你做一个 Worker。）' : '');
  }finally{
    busy = false; $('send').disabled = false;
  }
}

/* ---------- 事件 ---------- */
$('send').onclick = send;
$('input').addEventListener('keydown', (e)=>{
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
$('input').addEventListener('input', (e)=>{
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 132) + 'px';
});

$('btnSet').onclick = ()=>{
  $('cfgKey').value = cfg.key; $('cfgModel').value = cfg.model; $('cfgBase').value = cfg.base;
  $('cfgRepo').value = cfg.repo; $('cfgBranch').value = cfg.branch; $('cfgPat').value = cfg.pat;
  $('cfgPrefix').value = cfg.prefix;
  $('sheetSet').classList.add('open');
};
$('closeSet').onclick = ()=> $('sheetSet').classList.remove('open');
$('saveCfg').onclick = async ()=>{
  cfg.key = $('cfgKey').value.trim();
  cfg.model = $('cfgModel').value;
  cfg.base = $('cfgBase').value.trim() || 'https://api.deepseek.com';
  cfg.repo = $('cfgRepo').value.trim();
  cfg.branch = $('cfgBranch').value.trim() || 'main';
  cfg.pat = $('cfgPat').value.trim();
  cfg.prefix = $('cfgPrefix').value.trim() || 'pack';
  saveCfg();
  $('sheetSet').classList.remove('open');
  toast('已保存');
  try{ await normalizeRepo(); await pullPack(); toast('记忆包已同步'); }
  catch(e){ setStatus('warn','同步失败'); toast(e.message, 6000); }
};
$('diagBtn').onclick = async ()=>{
  const out = $('diagOut');
  out.style.display = 'block';
  out.textContent = '检查中…';
  const lines = [];
  lines.push(`repo=${cfg.repo}  branch=${cfg.branch}  prefix=${cfg.prefix}`);
  lines.push(`PAT 长度=${cfg.pat.length}  开头=${cfg.pat.slice(0, 11)}`);
  try{
    const r = await fetch('https://api.github.com/user', { headers: { Authorization: 'Bearer ' + cfg.pat, 'User-Agent': 'dsh-memo' } });
    lines.push(`token → HTTP ${r.status}`);
    if (r.ok){ const j = await r.json(); lines.push(`登录名=${j.login}`); }
  }catch(e){ lines.push('token 检查失败：' + e.message); }
  for (const p of [cfg.prefix, `${cfg.prefix}/meta.json`]){
    try{
      const r = await fetch(ghUrl(p, 'GET'), {
        headers: { Authorization: 'Bearer ' + cfg.pat, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
      });
      lines.push(`${p} → HTTP ${r.status}`);
      if (r.ok){
        const j = await r.json();
        if (Array.isArray(j)) lines.push('  目录内容: ' + j.map((x) => x.name).join(', '));
        else lines.push('  文件大小: ' + (j.size ?? '?') + 'B');
      }
    }catch(e){ lines.push(`${p} 请求失败：` + e.message); }
  }
  out.textContent = lines.join('\n');
};
$('btnMemo').onclick = ()=>{ renderMemo(); $('sheetMemo').classList.add('open'); };
$('closeMemo').onclick = ()=> $('sheetMemo').classList.remove('open');
$('btnMemoPull').onclick = async ()=>{
  try{ await pullPack(); toast('已重新拉取'); }catch(e){ toast(e.message, 3200); }
};
$('btnSync').onclick = async ()=>{
  setStatus('warn','同步中…');
  try{
    await pullPack();
    toast('记忆包已更新');
  }catch(e){ setStatus('err','同步失败'); toast(e.message, 3600); }
};

/* ---------- 启动 ---------- */
(async function boot(){
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
  renderMemo();
  if (!cfg.repo || !cfg.pat){ setStatus('','未配置'); return; }
  try{ await pullPack(); }catch(e){ setStatus('warn','拉取失败'); toast(e.message, 3000); }
})();
</script>
</body>
</html>
